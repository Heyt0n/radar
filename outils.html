<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radar Carburant - Actualités & Veille</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-principal: #0b0f19;
            --bg-panneau: #111827;
            --bg-carte: #1f2937;
            --accent-vert: #22c55e;
            --accent-bleu: #3b82f6;
            --accent-jaune: #eab308;
            --texte-principal: #f3f4f6;
            --texte-secondaire: #9ca3af;
            --border-color: #374151;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-principal);
            color: var(--texte-principal); font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body { display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

        header {
            background-color: var(--bg-panneau); padding: 0 20px;
            border-bottom: 1px solid #1f2937; display: flex;
            justify-content: space-between; align-items: center;
            z-index: 100; height: 50px; flex-shrink: 0;
            position: sticky; top: 0;
        }

        header h1 { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        .burger-btn {
            background: none; border: none; color: var(--texte-principal);
            font-size: 24px; cursor: pointer; padding: 5px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Menu Burger */
        .burger-menu {
            position: fixed; top: 0; right: -280px; width: 280px; height: 100%;
            background-color: var(--bg-panneau); border-left: 1px solid #1f2937;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5); z-index: 50000;
            transition: right 0.3s ease; padding: 24px; display: flex;
            flex-direction: column; gap: 12px;
        }
        .burger-menu.open { right: 0; }

        .menu-user-header {
            padding-top: 40px; padding-bottom: 16px;
            border-bottom: 1px solid #1f2937; margin-bottom: 12px;
        }
        .menu-user-status {
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--accent-vert); font-weight: 700; display: block; margin-bottom: 4px;
        }
        .menu-user-greeting { font-size: 15px; font-weight: 600; color: var(--texte-secondaire); }
        #nom-operateur { color: var(--texte-principal); font-weight: 800; }

        .menu-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); z-index: 49999; backdrop-filter: blur(2px);
        }
        .menu-overlay.active { display: block; }

        .menu-link {
            background: #1f2937; color: var(--texte-secondaire); border: 1px solid var(--border-color);
            padding: 12px 16px; border-radius: 8px; text-align: left; font-weight: 600;
            font-size: 14px; text-decoration: none; display: flex; align-items: center; gap: 12px;
        }
        .menu-link.active { background: var(--accent-bleu); border-color: var(--accent-bleu); color: #fff; }

        /* Style Grille Actu */
        .main-content {
            flex: 1; padding: 20px; width: 100%; max-width: 900px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 20px;
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #1f2937; padding-bottom: 10px;
        }
        .section-title {
            font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-jaune);
        }

        .news-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px;
        }

        .news-card {
            background: var(--bg-panneau); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 16px; display: flex; flex-direction: column;
            justify-content: space-between; transition: transform 0.2s, border-color 0.2s;
        }
        .news-card:hover {
            border-color: var(--accent-bleu); transform: translateY(-2px);
        }

        .news-tag {
            align-self: flex-start; background: rgba(59, 130, 246, 0.15); color: var(--accent-bleu);
            border: 1px solid rgba(59, 130, 246, 0.3); padding: 3px 8px; border-radius: 12px;
            font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 10px;
        }

        .news-title {
            font-size: 14px; font-weight: 700; color: var(--texte-principal);
            line-height: 1.4; margin-bottom: 8px;
        }

        .news-snippet {
            font-size: 12px; color: var(--texte-secondaire); line-height: 1.5;
            margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }

        .news-footer {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: var(--texte-secondaire); border-top: 1px solid #1f2937;
            padding-top: 10px; margin-top: auto;
        }

        .news-link-btn {
            color: var(--accent-vert); text-decoration: none; font-weight: bold;
            display: flex; align-items: center; gap: 4px;
        }
    </style>
</head>
<body>

    <div class="menu-overlay" id="menuOverlay"></div>

    <nav class="burger-menu" id="burgerMenu">
        <div class="menu-user-header">
            <span class="menu-user-status">📡 Système Connecté</span>
            <div class="menu-user-greeting">Bonjour, <span id="nom-operateur">Opérateur</span></div>
        </div>
        <a href="index.html" class="menu-link">📡 Radar Tactique</a>
        <a href="trajet.html" class="menu-link">🗺️ Mode Itinéraire</a>
        <a href="outils.html" class="menu-link active">📊 Actu & Veille</a>
        <a href="compte.html" class="menu-link">👤 Mon Compte</a>
    </nav>

    <header>
        <h1>Radar Carburant</h1>
        <button class="burger-btn" id="burgerBtn">☰</button>
    </header>

    <div class="main-content">
        <div class="section-header">
            <div class="section-title">📰 Flux d'Actualités Carburant</div>
            <span style="font-size: 11px; color: var(--texte-secondaire);" id="last-update">Mise à jour en cours...</span>
        </div>

        <div class="news-grid" id="news-container">
            <p style="font-size: 12px; color: var(--texte-secondaire); grid-column: 1/-1; text-align: center; padding: 40px 0;">
                ⚡ Chargement des flux d'informations du secteur...
            </p>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="outils.js"></script>
    <script src="commentaire.js"></script>
</body>
</html>
